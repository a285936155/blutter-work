name: Blutter Dart AOT Reverse
on:
  workflow_dispatch:
  push:
    paths:
      - 'libapp.so'

jobs:
  blutter:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FULL Dart SDK (with VM libraries)
        shell: bash
        run: |
          # Install from official Dart repository - includes VM libraries
          sudo apt-get update
          sudo apt-get install -y apt-transport-https curl gnupg
          curl -fsSL https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/dart.gpg
          echo 'deb [signed-by=/usr/share/keyrings/dart.gpg] https://storage.googleapis.com/download.dartlang.org/linux/debian stable main' | sudo tee /etc/apt/sources.list.d/dart_stable.list
          sudo apt-get update
          sudo apt-get install -y dart cmake g++ git build-essential python3
          
          # Verify VM libraries exist
          echo "=== Checking for VM libraries ==="
          find /usr/lib/dart -name "*dartvm*" -o -name "libdart*" 2>/dev/null | head -20
          ls -la /usr/lib/dart/ 2>/dev/null || true

      - name: Clone blutter
        shell: bash
        run: |
          git clone --depth=1 https://github.com/worawit/blutter.git
          echo "=== blutter root ==="
          ls -la blutter/

      - name: Build blutter
        shell: bash
        run: |
          cd blutter
          
          # Find dartvm library directory
          DARTLIB=""
          for p in \
            "/usr/lib/dart" \
            "/usr/lib/dart/dartvm" \
            "/usr/lib/dartvm"; do
            if [ -d "$p" ] && (ls "$p"/libdartvm*.so 2>/dev/null || ls "$p"/dartvm*.so 2>/dev/null); then
              DARTLIB="$p"
              echo "Found dartvm at: $DARTLIB"
              break
            fi
          done
          
          if [ -z "$DARTLIB" ]; then
            echo "ERROR: dartvm not found!"
            find /usr -name "*dartvm*" -o -name "libdartvm*" 2>/dev/null | head -20
            exit 1
          fi
          
          echo "Using DARTLIB: $DARTLIB"
          ls -la "$DARTLIB"
          
          # Build
          if [ -f "CMakeLists.txt" ]; then
            mkdir -p build && cd build
            cmake -DDARTLIB="$DARTLIB" .. 2>&1
            make -j$(nproc) 2>&1
          else
            for d in */; do
              if [ -f "${d}CMakeLists.txt" ]; then
                cd "$d"
                mkdir -p build && cd build
                cmake -DDARTLIB="$DARTLIB" .. 2>&1
                make -j$(nproc) 2>&1
                break
              fi
            done
          fi

      - name: Verify blutter binary and run
        shell: bash
        run: |
          cd blutter
          BLUTTER_BIN=$(find . -name "blutter" -type f -executable 2>/dev/null | head -1)
          if [ -n "$BLUTTER_BIN" ]; then
            echo "Found blutter at: $BLUTTER_BIN"
            cd $(dirname "$BLUTTER_BIN")
            file blutter
            ./blutter --help 2>&1 || true
            echo "Running blutter on libapp.so..."
            ./blutter ../../../libapp.so
            echo "Exit code: $?"
            ls -la ../../../libapp.dart 2>/dev/null || echo "Not in repo root"
            find ../../../ -name "libapp.dart" 2>/dev/null
            find . -name "libapp.dart" 2>/dev/null
          else
            echo "ERROR: blutter binary not found!"
            find . -type f -executable | head -20
          fi

      - name: Find and copy output
        shell: bash
        run: |
          echo "=== Searching for libapp.dart ==="
          find . -name "libapp.dart" 2>/dev/null
          find /home/runner/work -name "libapp.dart" 2>/dev/null
          
          FOUND=$(find . -name "libapp.dart" 2>/dev/null | head -1)
          if [ -n "$FOUND" ]; then
            cp "$FOUND" ./libapp.dart
            echo "Copied from $FOUND"
          else
            echo "libapp.dart not found"
          fi
          ls -la ./libapp.dart 2>/dev/null

      - name: Check output
        shell: bash
        run: |
          if [ -f libapp.dart ]; then
            ls -lh libapp.dart
            head -100 libapp.dart
          else
            echo "libapp.dart not found in root"
          fi

      - name: Upload Dart output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libapp-dart
          path: libapp.dart
          retention-days: 7
