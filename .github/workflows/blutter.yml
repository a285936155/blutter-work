name: Blutter Dart AOT Reverse
on:
  workflow_dispatch:
  push:
    paths:
      - 'libapp.so'

jobs:
  blutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git

      - name: Clone and build blutter
        run: |
          git clone --depth=1 https://github.com/worawit/blutter.git
          cd blutter
          mkdir build && cd build
          cmake ..
          make -j$(nproc)

      - name: Run blutter on libapp.so
        run: |
          cd blutter/build
          ./blutter ../../libapp.so > ../../libapp.dart 2>&1

      - name: Upload Dart output
        uses: actions/upload-artifact@v4
        with:
          name: libapp-dart
          path: libapp.dart
          retention-days: 7

      - name: Show file size
        run: |
          ls -lh libapp.dart
          head -20 libapp.dart
