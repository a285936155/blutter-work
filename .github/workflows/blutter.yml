name: Blutter Dart AOT Reverse
on:
  workflow_dispatch:
  push:
    paths:
      - 'libapp.so'

jobs:
  blutter:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 'stable'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git build-essential python3

      - name: Clone blutter and show full structure
        shell: bash
        run: |
          git clone --depth=1 https://github.com/worawit/blutter.git
          echo "=== blutter root ==="
          ls -la blutter/
          echo "=== ALL files ==="
          find blutter -type f | head -50

      - name: Find correct DARTLIB
        shell: bash
        run: |
          # Find Dart SDK and dartvm library
          DART_BIN=$(which dart)
          DART_SDK=$(dirname $(dirname "$DART_BIN"))
          echo "DART SDK: $DART_SDK"
          
          # Look for dartvm library
          find "$DART_SDK" -name "*dartvm*" -type f 2>/dev/null | head -20
          find "$DART_SDK" -name "libdart*" -type f 2>/dev/null | head -20
          
          # Check typical locations
          ls -la "$DART_SDK/lib/" 2>/dev/null || true
          ls -la "$DART_SDK/lib/dartvm/" 2>/dev/null || true

      - name: Build blutter with correct DARTLIB
        shell: bash
        run: |
          cd blutter
          
          # Find the actual dartvm library directory
          DART_BIN=$(which dart)
          DART_SDK=$(dirname $(dirname "$DART_BIN"))
          
          # Try multiple possible locations for dartvm
          DARTLIB=""
          for p in \
            "$DART_SDK/lib/dartvm" \
            "$DART_SDK/lib" \
            "$DART_SDK" \
            "/usr/lib/dart" \
            "/usr/local/lib/dart"; do
            if [ -d "$p" ] && (ls "$p"/libdartvm*.so 2>/dev/null || ls "$p"/dartvm*.so 2>/dev/null || ls "$p"/libdart*.so 2>/dev/null); then
              DARTLIB="$p"
              echo "Found dartvm at: $DARTLIB"
              break
            fi
          done
          
          if [ -z "$DARTLIB" ]; then
            echo "ERROR: dartvm not found!"
            find "$DART_SDK" -name "*dartvm*" -o -name "libdart*" 2>/dev/null | head -20
            exit 1
          fi
          
          echo "Using DARTLIB: $DARTLIB"
          
          if [ -f "CMakeLists.txt" ]; then
            echo "Found CMakeLists.txt in root"
            mkdir -p build && cd build
            cmake -DDARTLIB="$DARTLIB" .. 2>&1
            make -j$(nproc) 2>&1
          else
            echo "No CMakeLists.txt in root, checking subdirs"
            for d in */; do
              if [ -f "${d}CMakeLists.txt" ]; then
                echo "Found in $d"
                cd "$d"
                mkdir -p build && cd build
                cmake -DDARTLIB="$DARTLIB" .. 2>&1
                make -j$(nproc) 2>&1
                break
              fi
            done
          fi

      - name: Verify blutter binary and run
        shell: bash
        run: |
          cd blutter
          # Find the built binary
          BLUTTER_BIN=$(find . -name "blutter" -type f -executable 2>/dev/null | head -1)
          if [ -n "$BLUTTER_BIN" ]; then
            echo "Found blutter at: $BLUTTER_BIN"
            cd $(dirname "$BLUTTER_BIN")
            file blutter
            ./blutter --help 2>&1 || true
            # Run on libapp.so
            echo "Running blutter on libapp.so..."
            ./blutter ../../../libapp.so
            echo "Exit code: $?"
            # Check where output went
            ls -la ../../../libapp.dart 2>/dev/null || echo "Not in repo root"
            find ../../../ -name "libapp.dart" 2>/dev/null
            find . -name "libapp.dart" 2>/dev/null
          else
            echo "ERROR: blutter binary not found!"
            find . -type f -executable | head -20
          fi

      - name: Check output everywhere
        shell: bash
        run: |
          echo "=== Searching for libapp.dart ==="
          find . -name "libapp.dart" 2>/dev/null
          find /home/runner/work -name "libapp.dart" 2>/dev/null
          ls -la libapp.dart 2>/dev/null || echo "Not in current dir"

      - name: Copy to known location
        shell: bash
        run: |
          # Copy wherever it is to repo root
          FOUND=$(find . -name "libapp.dart" 2>/dev/null | head -1)
          if [ -n "$FOUND" ]; then
            cp "$FOUND" ./libapp.dart
            echo "Copied from $FOUND to ./libapp.dart"
          else
            echo "libapp.dart not found anywhere"
          fi
          ls -la ./libapp.dart 2>/dev/null

      - name: Check output
        shell: bash
        run: |
          if [ -f libapp.dart ]; then
            ls -lh libapp.dart
            head -100 libapp.dart
            echo "---"
            tail -20 libapp.dart
          else
            echo "libapp.dart not found in root"
          fi

      - name: Upload Dart output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libapp-dart
          path: libapp.dart
          retention-days: 7
