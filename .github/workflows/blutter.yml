name: Blutter Dart AOT Reverse
on:
  workflow_dispatch:
  push:
    paths:
      - 'libapp.so'

jobs:
  blutter:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install everything
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https curl gnupg
          curl -fsSL https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/dart.gpg
          echo 'deb [signed-by=/usr/share/keyrings/dart.gpg] https://storage.googleapis.com/download.dartlang.org/linux/debian stable main' | sudo tee /etc/apt/sources.list.d/dart_stable.list
          sudo apt-get update
          sudo apt-get install -y dart cmake g++ git build-essential python3

      - name: Clone and prepare
        shell: bash
        run: |
          git clone --depth=1 https://github.com/worawit/blutter.git
          cd blutter
          
          # Find CMakeLists.txt
          CMAKE_FILE=$(find . -name "CMakeLists.txt" | head -1)
          echo "Using: $CMAKE_FILE"
          cat "$CMAKE_FILE"
          
          # Find libdartvm.so
          LIBDARTVM=$(find /usr -name "libdartvm*.so" 2>/dev/null | head -1)
          echo "libdartvm.so: $LIBDARTVM"
          LIBDIR=$(dirname "$LIBDARTVM")
          
          # Create /usr/lib/dartvm with symlinks
          DARTLIB="/usr/lib/dartvm"
          sudo mkdir -p "$DARTLIB"
          sudo ln -sf "$LIBDIR"/libdartvm*.so "$DARTLIB"/ 2>/dev/null
          sudo ln -sf "$LIBDIR"/libdart*.so "$DARTLIB"/ 2>/dev/null
          echo "DARTLIB=$DARTLIB"
          ls -la "$DARTLIB"

      - name: Build blutter
        shell: bash
        run: |
          cd blutter
          CMAKE_DIR=$(dirname $(find . -name "CMakeLists.txt" | head -1))
          cd "$CMAKE_DIR"
          mkdir -p build && cd build
          cmake -DDARTLIB=/usr/lib/dartvm .. 2>&1
          make -j$(nproc) 2>&1

      - name: Run blutter
        shell: bash
        run: |
          cd blutter
          BLUTTER_BIN=$(find . -name "blutter" -type f -executable 2>/dev/null | head -1)
          if [ -z "$BLUTTER_BIN" ]; then
            echo "ERROR: blutter not built"
            find . -type f -executable 2>/dev/null | head -20
            exit 1
          fi
          echo "Found: $BLUTTER_BIN"
          cd "$(dirname "$BLUTTER_BIN")"
          ./blutter ../../../libapp.so > ../../../libapp.dart 2>&1
          echo "Exit code: $?"

      - name: Copy output to root
        shell: bash
        run: |
          FOUND=$(find /home/runner/work -name "libapp.dart" 2>/dev/null | head -1)
          if [ -n "$FOUND" ]; then
            cp "$FOUND" ./libapp.dart
            echo "Copied $FOUND"
          fi
          ls -la ./libapp.dart 2>/dev/null

      - name: Show preview
        shell: bash
        run: |
          if [ -f libapp.dart ]; then
            head -100 libapp.dart
            echo "--- Lines: $(wc -l < libapp.dart) ---"
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libapp-dart
          path: libapp.dart
          retention-days: 7
